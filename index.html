<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haunted Five – a Halloween word game</title>a
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#140C1E; --sky-top:#2E1745; --sky-bottom:#0E0816; --ink:#F2E9F5; --muted:#C2AFD0; --tile-border:#5E4775; --tile-fill:rgba(18,10,28,.6);
  --absent:#3A2D44; --present:#7C4FB8; --correct:#E8731A; --key:#4F3C5E; --tile-text:#F2E9F5;
  --moon:#F6E7B6; --hill-far:#24142F; --hill-near:#0B0610;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky{position:absolute;inset:0;background:radial-gradient(circle at 84% 12%,rgba(246,231,182,.16),transparent 38%),linear-gradient(var(--sky-top),var(--sky-bottom) 78%)}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
.bigmoon{position:absolute;top:calc(env(safe-area-inset-top,0px) + 28px);right:5vw;width:clamp(84px,17vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 34%,#FFF7DC,#F2DFA0 58%,#D6BE78);box-shadow:0 0 70px 24px rgba(246,231,182,.22)}
.bat{position:absolute;fill:var(--hill-near)}
.bat1{top:calc(env(safe-area-inset-top,0px) + 62px);right:calc(5vw + 34px);width:40px}
.bat2{top:calc(env(safe-area-inset-top,0px) + 120px);right:calc(5vw + 130px);width:28px;transform:rotate(-10deg)}
.bat3{top:calc(env(safe-area-inset-top,0px) + 30px);right:calc(5vw + 200px);width:22px;transform:rotate(8deg)}
.ground{position:absolute;left:0;bottom:0;width:100%;height:36vh;min-height:190px}
body > *:not(.scene){position:relative;z-index:1}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); min-height:100%;
  font-family:"Josefin Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; flex-direction:column; align-items:center;
  overflow-x:hidden;
}
header{width:100%;max-width:520px;padding:18px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{
  font-family:"Creepster","Chiller",fantasy; font-weight:400;
  font-size:clamp(2.2rem,9vw,3.2rem); margin:0; letter-spacing:.04em; line-height:1;
  color:var(--correct);
}
.moon{width:34px;height:34px;border-radius:50%;background:var(--moon);box-shadow:-8px 0 0 0 var(--bg) inset;flex:none}
.sub{width:100%;max-width:520px;padding:0 16px;margin:6px 0 0;color:var(--muted);font-size:1rem;line-height:1.4}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
button{font-family:inherit;cursor:pointer}
.pill{
  background:transparent;color:var(--ink);border:2px solid var(--tile-border);
  border-radius:999px;padding:8px 16px 6px;font-size:.95rem;font-weight:600;
}
.pill:hover{border-color:var(--present)}
button:focus-visible{outline:3px solid var(--correct);outline-offset:2px}
#hint{min-height:1.5em;margin:6px 16px 0;color:var(--muted);font-style:italic;text-align:center}
#board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;margin:12px 0;width:min(320px,82vw)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{
  aspect-ratio:1;border:2px solid var(--tile-border);background:var(--tile-fill);display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.5rem,7vw,2rem);font-weight:700;text-transform:uppercase;color:var(--tile-text);
  border-radius:6px;user-select:none;padding-top:.12em;
}
.tile.filled{border-color:var(--muted);animation:pop .1s ease-out}
.tile.absent{background:var(--absent);border-color:var(--absent);color:#fff}
.tile.present{background:var(--present);border-color:var(--present);color:#fff}
.tile.correct{background:var(--correct);border-color:var(--correct);color:#fff}
.tile.flip{animation:flip .5s ease forwards}
.row.shake{animation:shake .4s}
.row.float .tile{animation:float 1.6s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#msg{min-height:1.5em;font-weight:700;font-size:1.1rem;line-height:1.5;letter-spacing:.01em;text-align:center;max-width:30em;margin:14px 16px 16px}
#keyboard{width:100%;max-width:500px;padding:0 6px 16px;display:flex;flex-direction:column;gap:7px}
.krow{display:flex;gap:5px;justify-content:center}
.key{
  flex:1;max-width:44px;height:54px;border:none;border-radius:6px;background:var(--key);color:var(--ink);
  font-size:1.05rem;font-weight:700;text-transform:uppercase;padding-top:3px;
}
.key.wide{max-width:70px;flex:1.5;font-size:.8rem}
.key.absent{background:var(--absent);color:#fff}
.key.present{background:var(--present);color:#fff}
.key.correct{background:var(--correct);color:#fff}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:0 0 4px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
#winPop{border:2px solid var(--correct);border-radius:14px;background:#1F1229;color:var(--ink);padding:30px 24px 22px;width:min(340px,90vw);text-align:center;font-family:inherit}
#winPop::backdrop{background:rgba(8,4,14,.72)}
#winPop[open]{animation:popin .25s ease-out}
@keyframes popin{from{transform:scale(.92);opacity:0}}
#winTitle{font-family:"Creepster","Chiller",fantasy;font-weight:400;font-size:2.4rem;line-height:1.1;color:var(--correct);margin:0 0 6px;letter-spacing:.04em}
#winLine{margin:0 0 16px;color:var(--muted);line-height:1.4}
#resultText{display:inline-block;text-align:left;font-family:inherit;font-size:1.25rem;line-height:1.35;margin:0 0 18px;padding:12px 16px;background:rgba(0,0,0,.35);border-radius:8px;white-space:pre;user-select:all;-webkit-user-select:all}
.pop-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill.solid{background:var(--correct);border-color:var(--correct);color:#1A0E05}
#copyMsg{min-height:1.4em;margin:12px 0 0;font-size:.95rem;color:var(--muted)}
.close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);font-size:1.7rem;line-height:1;padding:4px 8px}
@media (prefers-reduced-motion: reduce){
  .tile,.row,#winPop[open]{animation:none!important}
}
</style>
</head>

<header>
  <h1>Haunted Five</h1>
</header>
<p class="sub">Guess the five-letter Halloween word in six tries.</p>

<div class="controls" id="days"></div>
<div class="controls">
  <button class="pill" id="newBtn">Play again</button>
  <button class="pill" id="shareBtn" hidden>Show my result</button>
</div>

<div id="board" aria-label="Game board"></div>
<div class="legend" aria-hidden="true">

  <span style="--c:var(--present)">In the word</span>
  <span style="--c:var(--absent)">Not in it</span>
</div>
<p id="msg" role="status" aria-live="polite"></p>
<div id="keyboard"></div>

<dialog id="winPop" aria-labelledby="winTitle">

    <button class="pill" id="againBtn">Play again</button>
  </div>
  <p id="copyMsg" role="status" aria-live="polite"></p>
</dialog>

WORDS.forEach(w => VALID.add(w[0]));
const ROWS = 6, COLS = 5;
let answer, hintText, guesses, current, over, history;
let day = WORDS.length - 1;
const board = document.getElementById("board");
const msg = document.getElementById("msg");
const shareBtn = document.getElementById("shareBtn");
const keyEls = {};

function buildBoard(){
  board.innerHTML = "";
  for(let r=0;r<ROWS;r++){
    const row = document.createElement("div");
    row.className = "row";
    for(let c=0;c<COLS;c++){
      const t = document.createElement("div");
      t.className = "tile";
      row.appendChild(t);
    }
    board.appendChild(row);
  }
}

function buildKeyboard(){
  const kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  const layout = ["QWERTYUIOP","ASDFGHJKL","+ZXCVBNM-"];
  layout.forEach(line=>{
    const row = document.createElement("div");
    row.className = "krow";
    for(const ch of line){
      const b = document.createElement("button");
      b.className = "key";
      if(ch === "+"){ b.textContent = "Enter"; b.classList.add("wide"); b.dataset.k = "ENTER"; }
      else if(ch === "-"){ b.textContent = "⌫"; b.classList.add("wide"); b.dataset.k = "BACK"; b.setAttribute("aria-label","Delete letter"); }
      else { b.textContent = ch; b.dataset.k = ch; keyEls[ch] = b; }
      b.addEventListener("click", ()=>handleKey(b.dataset.k));
      row.appendChild(b);
    }
    kb.appendChild(row);
  });
}

function newGame(){
  [answer, hintText] = WORDS[day];
  [...daysEl.children].forEach((b,i)=>{
    b.classList.toggle("solid", i === day);
    b.setAttribute("aria-pressed", i === day);
  });
  guesses = []; current = ""; over = false; history = [];
  msg.textContent = ""; shareBtn.hidden = true;
  buildBoard(); buildKeyboard();
}

function rowEl(i){ return board.children[i]; }

function render(){
  const row = rowEl(guesses.length);
  if(!row) return;
  [...row.children].forEach((t,i)=>{
    t.textContent = current[i] || "";
    t.classList.toggle("filled", !!current[i]);
  });
}

function score(guess){
  const res = Array(COLS).fill("absent");
  const counts = {};
  for(let i=0;i<COLS;i++){
    if(guess[i] === answer[i]) res[i] = "correct";
    else counts[answer[i]] = (counts[answer[i]]||0) + 1;
  }
  for(let i=0;i<COLS;i++){
    if(res[i] !== "correct" && counts[guess[i]] > 0){
      res[i] = "present"; counts[guess[i]]--;
    }
  }
  return res;
}

const rank = {absent:1, present:2, correct:3};

function submit(){
  if(current.length < COLS){
    msg.textContent = "Type all five letters first.";
    const r = rowEl(guesses.length);
    r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake");
    return;
  }
  if(!VALID.has(current)){
    msg.textContent = "That’s not in the word list. Try a real word.";
    const r = rowEl(guesses.length);
    r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake");
    return;
  }
  const guess = current, res = score(guess), row = rowEl(guesses.length);
  guesses.push(guess); history.push(res); current = ""; msg.textContent = "";
  over = true; // block input during reveal
  [...row.children].forEach((t,i)=>{
    setTimeout(()=>{
      t.classList.add("flip");
      setTimeout(()=>{
        t.classList.add(res[i]);
        const k = keyEls[guess[i]];
        const prev = ["absent","present","correct"].find(c=>k.classList.contains(c));
        if(!prev || rank[res[i]] > rank[prev]){
          k.classList.remove("absent","present","correct"); k.classList.add(res[i]);
        }
      }, 250);
    }, i*260);
  });
  setTimeout(()=>{
    if(guess === answer){
      const lines = ["Spook-tacular! First try.","Wickedly good!","Frightfully clever!","Got it!","Phew, close call.","Escaped the graveyard!"];
      msg.textContent = lines[guesses.length-1];
      row.classList.add("float");
      shareBtn.hidden = false;
      setTimeout(openPopup, 1200);
    } else if(guesses.length === ROWS){
      msg.textContent = "The word was " + answer + ". Try another?";
      shareBtn.hidden = false;
    } else {
      over = false;
    }
  }, COLS*260 + 300);
}

function handleKey(k){
  if(over) return;
  if(k === "ENTER") return submit();
  if(k === "BACK"){ current = current.slice(0,-1); msg.textContent = ""; return render(); }
  if(/^[A-Z]$/.test(k) && current.length < COLS){ current += k; render(); }
}

document.addEventListener("keydown", e=>{
  if(pop.open) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === "Enter"){ e.preventDefault(); handleKey("ENTER"); }
  else if(e.key === "Backspace") handleKey("BACK");
  else if(/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

document.getElementById("newBtn").addEventListener("click", e=>{ e.currentTarget.blur(); newGame(); });
const daysEl = document.getElementById("days");
WORDS.forEach((w,i)=>{
  const b = document.createElement("button");
  b.className = "pill";
  b.textContent = "Day " + (i+1);
  b.addEventListener("click", e=>{ e.currentTarget.blur(); day = i; newGame(); });
  daysEl.appendChild(b);
});
const pop = document.getElementById("winPop");
const resultEl = document.getElementById("resultText");
const copyMsg = document.getElementById("copyMsg");

function buildResult(){
  const won = guesses[guesses.length-1] === answer;
  const icons = {correct:"🎃", present:"🟪", absent:"⬛"};
  const grid = history.map(r=>r.map(c=>icons[c]).join("")).join("\n");
  return "Haunted Five Day " + (day+1) + " " + (won ? guesses.length : "X") + "/6\n" + grid;
}

function openPopup(){
  const won = guesses[guesses.length-1] === answer;
  const n = guesses.length;
  document.getElementById("winTitle").textContent = won ? "You found it!" : "The ghost got away";
  document.getElementById("winLine").textContent = won
    ? "You guessed " + answer + " in " + n + (n === 1 ? " try." : " tries.") + " Copy your result and paste it to a friend."
    : "The word was " + answer + ". Copy your result or try again.";
  resultEl.textContent = buildResult();
  copyMsg.textContent = "";
  if(!pop.open) pop.showModal();
  document.getElementById("copyBtn").focus();
}

document.getElementById("copyBtn").addEventListener("click", async ()=>{
  const text = buildResult();
  try {
    await navigator.clipboard.writeText(text);
    copyMsg.textContent = "Copied! Now paste it anywhere.";
  } catch {
    try {
      const range = document.createRange();
      range.selectNodeContents(resultEl);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      const ok = document.execCommand("copy");
      copyMsg.textContent = ok ? "Copied! Now paste it anywhere." : "The result is selected. Press Ctrl+C (or ⌘C) to copy it.";
    } catch {
      copyMsg.textContent = "Select the result above and copy it.";
    }
  }
});
document.getElementById("againBtn").addEventListener("click", ()=>{ pop.close(); newGame(); });
document.getElementById("closePop").addEventListener("click", ()=>pop.close());
shareBtn.addEventListener("click", openPopup);

(function(){
  const s = document.getElementById("stars");
  for(let i=0;i<70;i++){
    const d = document.createElement("span");
    d.className = "star";
    d.style.left = (Math.random()*100) + "%";
    d.style.top = (Math.random()*60) + "%";
    d.style.opacity = (0.25 + Math.random()*0.6).toFixed(2);
    if(Math.random() < .15){ d.style.width = d.style.height = "3px"; }
    s.appendChild(d);
  }
})();

newGame();
</script>
